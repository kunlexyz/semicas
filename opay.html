<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OPay Frontend-only Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Roboto, Arial; padding: 20px; max-width:760px; margin:auto; }
    label { display:block; margin-top:12px }
    input, button { padding:8px; font-size:16px; width:100%; box-sizing:border-box }
    .small { font-size:0.9rem; color:#666 }
  </style>
</head>
<body>
  <h1>OPay frontend-only demo</h1>
  <p class="small">This will call the OPay Cashier Create API from the browser using your <strong>public key</strong> and open the cashier page. <strong>Not secure for production</strong> — read warnings above.</p>

  <label>Amount (in minor units if required by your OPay setup — e.g. kobo for NGN)</label>
  <input id="amount" type="number" value="5000" />

  <label>Currency</label>
  <input id="currency" type="text" value="NGN" />

  <label>Order reference (optional)</label>
  <input id="orderRef" type="text" placeholder="order_12345" />

  <label>Customer name</label>
  <input id="name" type="text" placeholder="John Doe" />

  <label>Customer email</label>
  <input id="email" type="email" placeholder="john@example.com" />

  <label>Return URL (the page OPay will redirect to after payment)</label>
  <input id="returnUrl" type="text" value="./return.html?get=1" />
  
  <button onclick="startPayment()">Pay now</button>

  <pre id="log" style="margin-top:12px; background:#f6f8fa; padding:10px; border-radius:6px; overflow:auto; max-height:220px"></pre>

<script>
async function startPayment() {
  const payload = {
    country: "EG",
    amount: 5000,
    currency: "EGP",
    customer: { name: "John Doe", email: "john@example.com" },
    merchantOrderId: "281825092428140",
    reference: "281825092428140",
    redirectUrl: "https://videocourses.netlify.app/return.html",
    callbackUrl: "https://videocourses.netlify.app/.netlify/functions/webhook"
  };

  const resp = await fetch("https://videocourses.netlify.app/.netlify/functions/create-payment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await resp.json();

  if (data.cashierUrl) {
    window.location.href = data.cashierUrl;
  } else {
    console.error("No cashierUrl", data);
    alert("Payment initialization failed. See console.");
  }
}
</script>
</body>
</html>
